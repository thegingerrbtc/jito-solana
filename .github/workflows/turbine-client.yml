name: Turbine Client

on:
  push:
    branches:
      - Turbine-Client
    paths:
      - "gossip/src/turbine_client.rs"
      - "gossip/Cargo.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".gitmodules"
      - ".github/scripts/**"
      - ".github/workflows/turbine-client.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install rustfmt
        run: rustup component add rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Initialize required Jito submodules
        run: git submodule update --init --depth=1 anchor jito-programs jito-protos/protos

      - name: Install build dependencies
        shell: bash
        run: |
          source .github/scripts/install-all-deps.sh Linux
          sudo apt-get install -y libudev-dev

      - name: Check Turbine client
        run: cargo check -p solana-gossip --bin solana-turbine-client
